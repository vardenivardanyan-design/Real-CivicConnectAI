<style>
:root{--text:#0f2f26;--muted:#4b6f63;--dark-green:#006A4E;--light-green:#ACE1AF;--white:rgba(255,255,255,0.6);--panel:rgba(255,255,255,0.9);--border:rgba(0,0,0,0.08);--shadow:0 2px 10px rgba(0,0,0,0.06);--link:#1a73e8;}
*{box-sizing:border-box}
body{margin:0;font-family:'Alegreya',serif;background:#D5EEFD;color:var(--text);padding:3rem 1.5rem;text-align:center}
.card{max-width:1000px;margin:0 auto;padding:2.5rem;border-radius:18px;background:var(--white);backdrop-filter:blur(8px)}
h1{font-size:clamp(2.2rem,4vw,3rem);color:var(--dark-green)}
.badge{padding:.35rem .75rem;border-radius:999px;background:var(--light-green);color:var(--dark-green);font-size:.85rem;display:inline-flex;align-items:center;gap:.4rem;font-weight:700}
input{padding:.75rem 1rem;width:100%;max-width:360px;border-radius:14px;border:1px solid rgba(0,0,0,0.1);font-size:1rem;font-family:inherit}
button{padding:.75rem 1.25rem;border-radius:14px;font-size:1rem;border:none;cursor:pointer;font-family:inherit}
.primary{background:var(--dark-green);color:#fff}
.secondary{background:#fff;color:var(--dark-green);border:1px solid rgba(0,0,0,0.1)}
.hidden{display:none}
.city-grid{display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap}
.layout{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;align-items:start;text-align:left}
#places{max-height:70vh;overflow-y:auto;padding-right:.5rem}
.category{margin-bottom:2rem;text-align:left}
.category h2{color:var(--dark-green);margin-bottom:.75rem}

.place{background:var(--panel);border:1px solid var(--border);box-shadow:var(--shadow);padding:1rem 1rem .9rem;border-radius:14px;margin-bottom:.75rem}
.place-top{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem}
.place strong{font-size:1.1rem;color:#222}
.place-pill{padding:.28rem .65rem;border-radius:999px;background:rgba(0,106,78,0.10);color:var(--dark-green);border:1px solid rgba(0,106,78,0.18);font-weight:700;font-size:.9rem;white-space:nowrap}
.place-desc{margin:.5rem 0 .75rem;color:#333}
.place-meta{display:grid;gap:.45rem;margin:.2rem 0 .75rem;color:#333}
.meta-row{display:flex;gap:.5rem;align-items:flex-start}
.meta-ico{width:18px;height:18px;opacity:.7;flex:0 0 auto;margin-top:.15rem}
a.link{color:var(--link);text-decoration:none}
a.link:hover{text-decoration:underline}
.place-actions{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.2rem}
.action-btn{display:inline-flex;align-items:center;gap:.55rem;padding:.6rem 1rem;border-radius:12px;border:1px solid rgba(0,0,0,0.14);background:#fff;color:#222;font-weight:700}
.action-btn:hover{background:rgba(255,255,255,0.7)}
.map{height:70vh;border-radius:14px;overflow:hidden;background:rgba(255,255,255,0.7)}
#map{width:100%;height:100%}
.small-note{color:var(--muted);margin-top:.75rem}
@media(max-width:900px){.layout{grid-template-columns:1fr}.map{height:320px}}
</style>
</head>

<body>

<!-- Top row -->
<div style="max-width:1000px;margin:0 auto 1.5rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;">
  <button class="secondary" id="btnHome">← Home</button>

  <div style="display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;">
    <select id="languageSelect" class="secondary" style="padding:.7rem .9rem;">

      <option value="it">Italiano</option><option value="pt">Português</option><option value="zh">中文</option><option value="ja">日本語</option>

<section id="page1" class="card">

  <button class="secondary" id="btnUseLocation">Use Current Location</button>
  <br><br>

  <button class="primary" id="btnContinue">Continue</button>

  <div class="city-grid">

</section>

function navToHome(){
  const lang = document.getElementById("languageSelect").value || "en";
  setSavedLang(lang);
  const u = new URL("/", window.location.origin);

  window.location.href = u.toString();

function applyLanguage(lang){
  const t = translations[lang] || translations.en;
  document.documentElement.lang = lang;

  // set button/text nodes
  const setText = (id, val) => { const el=document.getElementById(id); if(el) el.textContent = val; };

  setText("btnHome", t.btnHome || translations.en.btnHome);
  setText("badgeLocation", t.badgeLocation || translations.en.badgeLocation);
  setText("titleCityQ", t.titleCityQ || translations.en.titleCityQ);
  setText("btnUseLocation", t.btnUseLocation || translations.en.btnUseLocation);
  setText("btnContinue", t.btnContinue || translations.en.btnContinue);
  setText("popularCities", t.popularCities || translations.en.popularCities);
  setText("badgeResources", t.badgeResources || translations.en.badgeResources);
  setText("osmNote", t.osmNote || translations.en.osmNote);

  // placeholder
  const cityInput = document.getElementById("cityInput");
  if(cityInput) cityInput.placeholder = t.cityInput || translations.en.cityInput;

  // tipNote includes html tags; keep simple (no innerHTML injection from user input)
  const tip = document.getElementById("tipNote");
  if(tip) tip.textContent = (t.tipNote || translations.en.tipNote);

  // re-render category titles/descs if already on page2
  if(!document.getElementById("page2").classList.contains("hidden")){
    if(lastCenterLabel){
      document.getElementById("cityTitle").textContent = cityTitleText(lastCenterLabel);
    }
    // reload the places UI to update category headers + buttons
    if(lastLatLng) loadResources(lastLatLng.lat, lastLatLng.lng).catch(()=>{});
  }
}

function tGet(lang, key){
  const t = translations[lang] || translations.en;
  return t[key] || translations.en[key] || "";
}

function ico(kind){
  const common = `class="meta-ico" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"`;
  if(kind==="pin") return `<svg ${common}><path d="M12 21s7-4.5 7-11a7 7 0 1 0-14 0c0 6.5 7 11 7 11Z" stroke="currentColor" stroke-width="1.8"/><path d="M12 10.5a2.2 2.2 0 1 0 0-4.4 2.2 2.2 0 0 0 0 4.4Z" stroke="currentColor" stroke-width="1.8"/></svg>`;
  if(kind==="phone") return `<svg ${common}><path d="M6.5 3.5h3l1 4-2 1.5c1.5 3.1 3.9 5.5 7 7L17 14l4 1v3c0 1.1-.9 2-2 2-9.4 0-17-7.6-17-17 0-1.1.9-2 2-2Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>`;
  if(kind==="globe") return `<svg ${common}><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z" stroke="currentColor" stroke-width="1.8"/><path d="M3 12h18" stroke="currentColor" stroke-width="1.8"/><path d="M12 3c2.5 2.6 3.9 6 3.9 9s-1.4 6.4-3.9 9c-2.5-2.6-3.9-6-3.9-9S9.5 5.6 12 3Z" stroke="currentColor" stroke-width="1.8"/></svg>`;
  if(kind==="clock") return `<svg ${common}><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z" stroke="currentColor" stroke-width="1.8"/><path d="M12 7v6l4 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`;
  return "";
}

function toRad(v){ return v * Math.PI / 180; }
function haversine(lat1,lon1,lat2,lon2){
  const R=3958.8;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R*(2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)));
}

function looksNonprofitOrGov(tags){
  const t=tags||{};
  const name=(t.name||"").toLowerCase();
  const operator=(t.operator||"").toLowerCase();
  const website=(t.website||t["contact:website"]||"").toLowerCase();
  const hay=`${name} ${operator}`.trim();
  if(website.includes(".gov")) return true;
  if(website.includes(".org")) return true;
  const nonprofitWords=["foundation","charity","nonprofit","non-profit","aid","shelter","community","mission","ministry","food bank","legal aid"];
  const govWords=["city of","county","department","public health","state of","municipal","authority","office of"];
  if(nonprofitWords.some(w=>hay.includes(w))) return true;
  if(govWords.some(w=>hay.includes(w))) return true;
  const s=JSON.stringify(t).toLowerCase();
  if(s.includes("government")||s.includes("ngo")||s.includes("non_profit")||s.includes("nonprofit")) return true;
  return false;
}

function escapeHtml(str){ return String(str??"").replace(/[&<>"']/g,s=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[s])); }
function escapeAttr(str){ return String(str??"").replace(/["']/g,""); }

async function geocodeCity(cityText){
  const res=await fetch(`/api/geocode?q=${encodeURIComponent(cityText)}`);
  if(!res.ok) throw new Error(`Geocode failed: ${res.status}`);
  const data=await res.json();
  if(!data||!data.length) return null;
  return { lat:parseFloat(data[0].lat), lng:parseFloat(data[0].lon), label:data[0].display_name };
}

async function overpassFetch(lat,lng,radiusMeters,categoryFilters){
  const around=`(around:${radiusMeters},${lat},${lng})`;
  const query=`[out:json][timeout:25];( ${categoryFilters.map(f=>`${f}${around};`).join("\n  ")} );out center tags;`;
  const res=await fetch("/api/overpass",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query})});
  const text=await res.text();
  let json; try{ json=JSON.parse(text); } catch{ throw new Error("Overpass returned non-JSON: "+text.slice(0,200)); }
  return json.elements||[];
}

function normalizeElement(el){
  const tags=el.tags||{};
  const name=tags.name||"Unnamed place";
  const lat=el.lat??el.center?.lat;
  const lng=el.lon??el.center?.lon;
  const website=tags.website||tags["contact:website"]||"";
  const phone=tags.phone||tags["contact:phone"]||"";
  const addrParts=[tags["addr:housenumber"],tags["addr:street"]].filter(Boolean).join(" ");
  const city=tags["addr:city"]||"";
  const state=tags["addr:state"]||"";
  const postcode=tags["addr:postcode"]||"";
  const address=[addrParts,[city,state].filter(Boolean).join(", "),postcode].filter(Boolean).join(" ").replace(/\s+/g," ").trim();
  return { name, lat, lng, website, phone, address, tags };
}

function cityTitleText(label){
  // keep the city label as-is, translate only the prefix
  // EN fallback: "Local Help Near"
  const lang=currentLang();
  const prefix = (lang==="es") ? "Ayuda local cerca de " :
                 (lang==="fr") ? "Aide locale près de " :
                 "Local Help Near ";
  return prefix + (label || "your area");
}

function showPage2(lat,lng,label){
  lastLatLng = {lat,lng};
  lastCenterLabel = label || "your area";

  document.getElementById("page1").classList.add("hidden");
  document.getElementById("page2").classList.remove("hidden");
  document.getElementById("cityTitle").textContent = cityTitleText(lastCenterLabel);

  if(!map){
    map=L.map("map",{zoomControl:true}).setView([lat,lng],13);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
  } else {
    map.setView([lat,lng],13);
  }

  leafletMarkers.forEach(m=>m.remove());
  leafletMarkers=[];

  leafletMarkers.push(L.marker([lat,lng]).addTo(map).bindPopup(tGet(currentLang(),"centerPoint")));

  loadResources(lat,lng).catch(err=>{
    console.error(err);
    setStatus(tGet(currentLang(),"statusBusy"));
  });
}

async function loadResources(lat,lng){
  const placesContainer=document.getElementById("places");
  placesContainer
  placesContainer.innerHTML = "";
  setStatus(tGet(currentLang(),"statusLoading"));

  const radiusMeters = 4000; // ~2.5 miles
  const cats = categoryDefs();
  const lang = currentLang();

  // Collect results per category
  const byCat = {};
  for (const cat of cats) {
    try {
      const raw = await overpassFetch(lat, lng, radiusMeters, cat.filters);
      const norm = raw.map(normalizeElement).filter(p => p.lat && p.lng);

      // Deduplicate by name+lat+lng
      const seen = new Set();
      const dedup = [];
      for (const p of norm) {
        const key = `${(p.name||"").toLowerCase()}|${p.lat.toFixed(5)}|${p.lng.toFixed(5)}`;
        if (seen.has(key)) continue;
        seen.add(key);
        dedup.push(p);
      }

      // Sort by distance
      dedup.sort((a,b)=>haversine(lat,lng,a.lat,a.lng)-haversine(lat,lng,b.lat,b.lng));

      byCat[cat.key] = dedup.slice(0, 12);
    } catch (e) {
      console.warn("Category fetch failed", cat.key, e);
      byCat[cat.key] = [];
    }
  }

  // Render UI
  let any = false;

  for (const cat of cats) {
    const list = byCat[cat.key] || [];
    if (list.length) any = true;

    const section = document.createElement("div");
    section.className = "category";

    const h2 = document.createElement("h2");
    h2.textContent = cat.title;
    section.appendChild(h2);

    const desc = document.createElement("p");
    desc.style.marginTop = "-0.25rem";
    desc.style.marginBottom = "0.9rem";
    desc.style.color = "var(--muted)";
    desc.textContent = cat.desc;
    section.appendChild(desc);

    list.forEach((p, idx) => {
      const miles = haversine(lat,lng,p.lat,p.lng);
      const milesLabel = `${miles.toFixed(1)} ${tGet(lang,"milesAway")}`;

      const verified = looksNonprofitOrGov(p.tags);
      const pillText = verified ? tGet(lang,"verified") : tGet(lang,"unverified");

      // Add marker to map
      const marker = L.marker([p.lat, p.lng]).addTo(map);
      leafletMarkers.push(marker);

      const safeName = escapeHtml(p.name || "Unnamed place");
      marker.bindPopup(`<b>${safeName}</b><br>${escapeHtml(milesLabel)}`);

      const card = document.createElement("div");
      card.className = "place";

      const top = document.createElement("div");
      top.className = "place-top";

      const left = document.createElement("div");
      left.style.flex = "1";

      const strong = document.createElement("strong");
      strong.textContent = p.name || "Unnamed place";
      left.appendChild(strong);

      const pill = document.createElement("span");
      pill.className = "place-pill";
      pill.textContent = pillText;
      top.appendChild(left);
      top.appendChild(pill);

      card.appendChild(top);

      // Meta
      const meta = document.createElement("div");
      meta.className = "place-meta";

      // Address
      const addrRow = document.createElement("div");
      addrRow.className = "meta-row";
      addrRow.innerHTML = `${ico("pin")} <div>${escapeHtml(p.address || tGet(lang,"addressNotListed"))}<br><span style="color:var(--muted);font-size:.95rem">${escapeHtml(milesLabel)}</span></div>`;
      meta.appendChild(addrRow);

      // Phone
      const phoneRow = document.createElement("div");
      phoneRow.className = "meta-row";
      phoneRow.innerHTML = `${ico("phone")} <div>${p.phone ? escapeHtml(p.phone) : `<span style="color:var(--muted)">${escapeHtml(tGet(lang,"notListed"))}</span>`}</div>`;
      meta.appendChild(phoneRow);

      // Website
      const webRow = document.createElement("div");
      webRow.className = "meta-row";
      const safeWeb = p.website ? escapeAttr(p.website) : "";
      webRow.innerHTML = `${ico("globe")} <div>${
        p.website
          ? `<a class="link" href="${safeWeb.startsWith("http") ? safeWeb : "https://" + safeWeb}" target="_blank" rel="noopener">${escapeHtml(p.website)}</a>`
          : `<span style="color:var(--muted)">${escapeHtml(tGet(lang,"notListed"))}</span>`
      }</div>`;
      meta.appendChild(webRow);

      // Hours (OSM often missing)
      const hoursRow = document.createElement("div");
      hoursRow.className = "meta-row";
      hoursRow.innerHTML = `${ico("clock")} <div><span style="color:var(--muted)">${escapeHtml(tGet(lang,"hoursNote"))}</span></div>`;
      meta.appendChild(hoursRow);

      card.appendChild(meta);

      // Actions
      const actions = document.createElement("div");
      actions.className = "place-actions";

      // Directions (Google Maps link)
      const aDir = document.createElement("a");
      aDir.className = "action-btn link";
      aDir.href = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(`${p.lat},${p.lng}`)}`;
      aDir.target = "_blank";
      aDir.rel = "noopener";
      aDir.textContent = tGet(lang,"dir");
      actions.appendChild(aDir);

      // Call
      const btnCall = document.createElement("button");
      btnCall.className = "action-btn";
      btnCall.type = "button";
      btnCall.textContent = tGet(lang,"call");
      btnCall.addEventListener("click", () => {
        if (!p.phone) return alert(tGet(lang,"noPhone"));
        const tel = String(p.phone).replace(/[^\d+]/g,"");
        window.location.href = `tel:${tel}`;
      });
      actions.appendChild(btnCall);

      // Website
      const btnWeb = document.createElement("button");
      btnWeb.className = "action-btn";
      btnWeb.type = "button";
      btnWeb.textContent = tGet(lang,"website");
      btnWeb.addEventListener("click", () => {
        if (!p.website) return alert(tGet(lang,"noWebsite"));
        const url = p.website.startsWith("http") ? p.website : ("https://" + p.website);
        window.open(url, "_blank", "noopener");
      });
      actions.appendChild(btnWeb);

      card.appendChild(actions);

      // Hover -> focus marker
      card.addEventListener("mouseenter", () => marker.openPopup());
      card.addEventListener("mouseleave", () => marker.closePopup());
      card.addEventListener("click", () => {
        map.setView([p.lat, p.lng], 15, { animate: true });
        marker.openPopup();
      });

      section.appendChild(card);
    });

    placesContainer.appendChild(section);
  }

  if (!any) {
    const empty = document.createElement("div");
    empty.className = "place";
    empty.innerHTML = `<div class="place-top"><strong>${escapeHtml(tGet(lang,"noResultsTitle"))}</strong></div>
      <div class="place-desc">${escapeHtml(tGet(lang,"noResultsBody"))}</div>`;
    placesContainer.appendChild(empty);
  }

  setStatus(tGet(lang,"statusDone"));
}

/* ================== UI EVENTS ================== */
document.getElementById("btnHome").addEventListener("click", navToHome);

document.getElementById("btnUseLocation").addEventListener("click", () => {
  if (!navigator.geolocation) {
    alert(tGet(currentLang(),"alertLookupFailed"));
    return;
  }
  navigator.geolocation.getCurrentPosition(
    pos => {
      showPage2(pos.coords.latitude, pos.coords.longitude, "your location");
    },
    err => {
      console.error(err);
      alert(tGet(currentLang(),"alertLookupFailed"));
    },
    { enableHighAccuracy: true, timeout: 8000 }
  );
});

document.getElementById("btnContinue").addEventListener("click", async () => {
  const cityText = document.getElementById("cityInput").value.trim();
  if (!cityText) return alert(tGet(currentLang(),"alertTypeCity"));

  try {
    const geo = await geocodeCity(cityText);
    if (!geo) return alert(tGet(currentLang(),"alertCityNotFound"));
    showPage2(geo.lat, geo.lng, geo.label);
  } catch (e) {
    console.error(e);
    alert(tGet(currentLang(),"alertLookupFailed"));
  }
});

// Language change
document.getElementById("languageSelect").addEventListener("change", (e) => {
  const lang = e.target.value || "en";
  setSavedLang(lang);
  applyLanguage(lang);
});

/* ================== INITIAL LANGUAGE + BOOT ================== */
(function init(){
  // pull language in this priority order: ?lang= -> localStorage -> default en
  const urlLang = getLangFromUrl();
  const saved = getSavedLang();
  const lang = urlLang || saved || "en";

  const select = document.getElementById("languageSelect");
  if (Array.from(select.options).some(o => o.value === lang)) {
    select.value = lang;
  } else {
    select.value = "en";
  }

  applyLanguage(select.value);
})();
</script>
