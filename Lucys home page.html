<style>
:root{
  --text:#0f2f26;--muted:#4b6f63;--dark-green:#006A4E;--white:rgba(255,255,255,0.92);--light-green:#ACE1AF;
  --glass:rgba(255,255,255,0.25);--shadow:0 12px 40px rgba(0,0,0,0.08);
  --danger:#b91c1c;--danger-bg:rgba(185,28,28,0.08);--danger-stroke:rgba(185,28,28,0.30);
}
*{box-sizing:border-box}
body{margin:0;font-family:'Alegreya',serif;color:var(--text);background:#D5EEFD}
.hero-bg{position:fixed;inset:0;background:url('fade_img.png') center/cover no-repeat;opacity:0;animation:fadeIn 2s forwards;z-index:-2}
@keyframes fadeIn{to{opacity:1}}

header{display:flex;align-items:center;justify-content:space-between;padding:1rem 2rem;background:var(--white);border-bottom:1px solid rgba(0,0,0,0.05);position:relative;z-index:2;gap:.8rem;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:.6rem;font-weight:700;font-size:1.1rem;color:var(--dark-green)}
.logo-badge{width:34px;height:34px;border-radius:10px;background:var(--dark-green);color:#fff;display:grid;place-items:center;font-size:.9rem}
nav{display:flex;gap:1.6rem;font-size:.95rem;flex-wrap:wrap}
nav a{text-decoration:none;color:var(--muted);cursor:pointer}
nav a.active{color:var(--dark-green);font-weight:600}
.nav-actions{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap}
select,button{border-radius:10px;padding:.45rem .8rem;border:1px solid rgba(0,0,0,0.08);background:#fff;font-family:'Alegreya',serif;font-size:.9rem;cursor:pointer}
.primary{background:var(--dark-green);color:#fff;border:none}
.secondary{background:#fff;color:var(--dark-green)}
.call311,.call911{cursor:pointer}

main{max-width:1200px;margin:0 auto;padding:5rem 2rem 2.5rem;display:grid;grid-template-columns:1fr;gap:2.2rem;position:relative;z-index:1}

.hero-content,.page-content,.home-panel{
  position:relative;display:inline-block;max-width:900px;padding:2rem 2.5rem;border-radius:16px;
  background:var(--glass);backdrop-filter:blur(6px);overflow:hidden;border:1px solid rgba(255,255,255,0.25)
}
.hero-content::before,.page-content::before,.home-panel::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0) 70%);border-radius:16px
}

.badge{display:inline-flex;align-items:center;gap:.4rem;padding:.35rem .75rem;border-radius:999px;background:var(--light-green);color:var(--dark-green);font-size:.85rem;font-weight:500}
h1{font-size:clamp(2.6rem,4.5vw,3.6rem);margin:1rem 0;line-height:1.1;color:var(--dark-green)}
.highlight{font-size:.75em;color:#2f8f6a}
p{color:var(--muted);font-size:1.1rem;max-width:720px}
.cta{display:flex;gap:1rem;margin-top:2.2rem;flex-wrap:wrap}
.cta button{padding:.85rem 1.3rem;font-size:1.05rem;border-radius:14px}
.features{display:flex;gap:1.6rem;margin-top:2.2rem;color:var(--muted);font-size:.95rem;flex-wrap:wrap}

/* How it works */
.home-title{text-align:center;margin:0 0 .4rem;font-size:2.2rem;font-weight:700;color:var(--dark-green)}
.home-sub{text-align:center;margin:0 auto 1.6rem;color:var(--muted);font-size:1.1rem;max-width:820px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.6rem}
.step{position:relative;text-align:center;padding:1.2rem .8rem .6rem;border-radius:14px;background:rgba(255,255,255,0.16);border:1px solid rgba(255,255,255,0.22)}
.step-num{position:absolute;left:50%;transform:translateX(-50%);top:-14px;width:34px;height:34px;border-radius:50%;background:var(--dark-green);color:#fff;display:grid;place-items:center;font-weight:700;border:2px solid rgba(255,255,255,0.55)}
.step-icon{width:68px;height:68px;border-radius:18px;background:rgba(255,255,255,0.22);border:1px solid rgba(255,255,255,0.30);display:grid;place-items:center;margin:1.2rem auto 1rem}
.step-icon svg{width:30px;height:30px;stroke:var(--dark-green)}
.step h3{margin:.1rem 0 .45rem;font-size:1.35rem;color:var(--dark-green)}
.step p{margin:0 auto;font-size:1.05rem;color:var(--muted);max-width:320px}

/* Footer */
.footer-wrap{width:100%;padding:0 0 2.2rem}
.emergency-bar{max-width:1200px;margin:0 auto 1.1rem;padding:0 2rem}
.emergency-inner{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1.05rem 1.2rem;background:var(--danger-bg);border:1px solid var(--danger-stroke);border-left:6px solid var(--danger);border-radius:14px;backdrop-filter:blur(6px)}
.em-left{display:flex;align-items:flex-start;gap:.9rem}
.em-badge{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(185,28,28,0.10);border:1px solid rgba(185,28,28,0.18)}
.em-badge svg{width:22px;height:22px;stroke:var(--danger)}
.em-text strong{display:block;font-size:1.05rem;margin-bottom:.15rem;color:rgba(0,0,0,0.78)}
.em-text span{color:rgba(0,0,0,0.55)}
.em-btn{background:var(--danger);color:#fff;border:none;padding:.7rem 1rem;border-radius:12px;font-weight:700;display:flex;align-items:center;gap:.55rem;white-space:nowrap}

.site-footer{max-width:1200px;margin:0 auto;padding:0 2rem}
.footer-card{background:rgba(255,255,255,0.60);border:1px solid rgba(255,255,255,0.35);border-radius:18px;padding:2rem 2rem 1.2rem;box-shadow:var(--shadow);backdrop-filter:blur(8px)}
.footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:1.8rem}
.footer-brand{display:flex;gap:.9rem;align-items:flex-start}
.footer-brand .cc{width:44px;height:44px;border-radius:12px;background:var(--dark-green);color:#fff;display:grid;place-items:center;font-weight:800}
.footer-brand h4{margin:0;font-size:1.2rem;color:var(--dark-green)}
.footer-brand p{margin:.35rem 0 .9rem;color:var(--muted);font-size:1.02rem;max-width:420px}
.lang-pills{display:flex;flex-wrap:wrap;gap:.55rem}
.pill{border:1px solid rgba(0,106,78,0.22);color:rgba(15,47,38,0.78);background:rgba(255,255,255,0.55);padding:.35rem .75rem;border-radius:999px;font-size:.95rem;cursor:pointer}
.pill.active{border-color:rgba(0,106,78,0.55);color:var(--dark-green);font-weight:700;background:rgba(255,255,255,0.70)}
.footer-col h5{margin:0 0 .8rem;font-size:1.15rem;color:rgba(0,0,0,0.78)}
.footer-links{display:flex;flex-direction:column;gap:.6rem}
.footer-links a{color:var(--muted);text-decoration:none;cursor:pointer}
.footer-links a:hover{text-decoration:underline}
.help-item{display:flex;gap:.6rem;align-items:center;color:var(--muted);text-decoration:none;cursor:pointer}
.help-item svg{width:18px;height:18px;stroke:rgba(15,47,38,0.55)}
.footer-bottom{border-top:1px solid rgba(0,0,0,0.08);margin-top:1.4rem;padding-top:1rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;color:rgba(0,0,0,0.52);font-size:.95rem}
.footer-bottom a{color:rgba(0,0,0,0.55);text-decoration:none;cursor:pointer}
.footer-bottom a:hover{text-decoration:underline}

/* Modal */
#modalOverlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:none;justify-content:center;align-items:center;z-index:999}
.modalContent{background:#fff;padding:2rem;border-radius:16px;max-width:400px;width:90%;position:relative;box-shadow:0 8px 20px rgba(0,0,0,0.2);text-align:center}
.closeModal{position:absolute;top:12px;right:16px;font-size:1.5rem;cursor:pointer}
.modalStep{display:flex;flex-direction:column;gap:1rem;margin-top:1rem}
.modalStep input,.modalStep label{width:100%;text-align:left}
#modalForm button{padding:.75rem;font-size:1rem;border-radius:12px}
.more-btn{margin:.5rem 0;background:var(--light-green);border:none;padding:.6rem;font-weight:500;border-radius:10px;cursor:pointer}

@media(max-width:900px){
  main{padding:3rem 1rem 2rem}
  header{padding:1rem}
  .hero-content,.page-content,.home-panel{padding:1.5rem}
  .steps{grid-template-columns:1fr}
  .footer-grid{grid-template-columns:1fr}
  .emergency-bar,.site-footer{padding:0 1rem}
}
</style>
</head>

const ids = Object.keys(translations.en);

function applyLanguage(lang){
  const t = translations[lang] || translations.en;
  document.documentElement.lang = lang;

  ids.forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    const val = t[id];
    if(val == null) return;
    if(el.tagName==="INPUT" || el.tagName==="TEXTAREA"){ if("placeholder" in el) el.placeholder = val; return; }
    el.textContent = val;
  });

  document.querySelectorAll("#footerLangPills .pill").forEach(p=>p.classList.remove("active"));
  const match = document.querySelector(`#footerLangPills .pill[data-lang="${lang}"]`);
  if(match) match.classList.add("active");

  updateProfileDisplay();
}

  if(footerCall311) footerCall311.addEventListener("click", ()=>window.location.href="tel:311");

  const footerContact = document.getElementById("footerContact");
if (footerContact) {
  footerContact.addEventListener("click", () => {
    showInfo("Email us at: Civicconnectaiwebsite@gmail.com");

}

  const privacyLink=document.getElementById("privacyLink");

/* Avatars */
let selectedAvatar=null;
const profileChoices=document.getElementById("profileChoices");
for(let i=1;i<=10;i++){
  const img=document.createElement("img");
  img.src=`https://i.pravatar.cc/100?img=${i+10}`;
  img.className="avatarOption";
  img.style.width="60px";img.style.height="60px";img.style.borderRadius="50%";img.style.cursor="pointer";img.style.border="2px solid transparent";
  img.addEventListener("click", ()=>{
    document.querySelectorAll(".avatarOption").forEach(i=>i.style.border="2px solid transparent");
    img.style.border="2px solid var(--dark-green)";
    selectedAvatar=img.src;
  });
  profileChoices.appendChild(img);
}

/* Greeting translated */
function updateProfileDisplay(){
  const greeting=document.getElementById("profileGreeting");
  const avatarImg=document.getElementById("profileAvatar");
  const lang=languageSelect.value;
  const t=translations[lang]||translations.en;

  if(!currentUserEmail){
    greeting.textContent=t.greetGuest || "Hello, user!";
    avatarImg.src=""; avatarImg.style.display="none";
    return;
  }
  const users=JSON.parse(localStorage.getItem("users")||"{}");
  const user=users[currentUserEmail];
  if(user){
    const template=t.greetUser || "Hello, {name}!";
    greeting.textContent=template.replace("{name}", user.firstName);
    avatarImg.src=user.avatar; avatarImg.style.display="block";
  }
}

document.addEventListener("DOMContentLoaded", ()=>{
  renderHome();

  // pick lang: URL > localStorage > en
  const urlLang = getLangFromUrl();
  const savedLang = getSavedLang();
  const initialLang = (urlLang || savedLang || "en");
  languageSelect.value = initialLang;
  setSavedLang(initialLang);
  applyLanguage(initialLang);
});

const profileBox = document.getElementById("profileBox");

profileBox.addEventListener("click", () => {
  if (!currentUserEmail) {
    // if not logged in, open login modal instead
    document.getElementById("modalTitle").textContent = "Log In";
    document.getElementById("modalOverlay").style.display = "flex";
    return;
  }

  openAccountModal();
});



document.querySelector(".closeModal").addEventListener("click", () => {
  const modal = document.getElementById("modalOverlay");
  const modalContent = document.getElementById("modalContent");

  modal.style.display = "none";

  // 🔥 FULL RESET
  modalContent.querySelectorAll(".accountView").forEach(e => e.remove());
  document.getElementById("signupStep1").style.display = "none";
  document.getElementById("signupStep2").style.display = "none";
  document.getElementById("signupStep3").style.display = "none";
});
