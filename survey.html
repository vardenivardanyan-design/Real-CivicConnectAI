<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Survey</title>

  <style>
    :root{
      --c-sky: #D5EEFD;
      --c-teal: #88CFA1;
      --c-mint: #ACE1AF;
      --c-forest:#006A4E;

      --text: #10332b;
      --muted: rgba(16,51,43,0.62);
      --stroke: rgba(0,106,78,0.16);

      --glass: rgba(255,255,255,0.55);
      --glass-2: rgba(255,255,255,0.40);
      --glass-3: rgba(255,255,255,0.30);

      --shadow: 0 18px 55px rgba(0,0,0,0.10);
      --radius: 22px;

      --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial;
    }

    *{ box-sizing: border-box; }

    body{
      margin:0;
      min-height:100vh;
      font-family: var(--font);
      color: var(--text);

      background:
        radial-gradient(900px 600px at 12% 12%, rgba(213,238,253,0.95), transparent 60%),
        radial-gradient(900px 650px at 88% 25%, rgba(172,225,175,0.65), transparent 60%),
        radial-gradient(900px 700px at 50% 120%, rgba(136,207,161,0.55), transparent 60%),
        linear-gradient(180deg, rgba(213,238,253,0.55), rgba(172,225,175,0.40));
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 26px;
    }

    .app{
      width: min(1020px, 100%);
      display:grid;
      grid-template-columns: 300px 1fr;
      gap: 18px;
      padding: 18px;
      border-radius: calc(var(--radius) + 6px);
      border: 1px solid var(--stroke);
      box-shadow: var(--shadow);

      background: rgba(255,255,255,0.28);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .left{
      border-radius: var(--radius);
      background: var(--glass-2);
      border: 1px solid var(--stroke);
      padding: 18px;
      display:flex;
      flex-direction:column;
      gap: 14px;
      justify-content:space-between;
      min-height: 560px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      user-select:none;
    }
    .dot{
      width: 12px; height: 12px; border-radius: 999px;
      background: var(--c-forest);
      box-shadow: 0 0 0 6px rgba(0,106,78,0.12);
    }
    .brand h1{
      margin:0;
      font-size: 14px;
      letter-spacing: 0.5px;
      color: var(--c-forest);
      font-weight: 700;
    }
    .brand span{
      margin-left:auto;
      color: var(--muted);
      font-size: 12px;
    }

    .avatarWrap{
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 6px 0;
    }
    .avatarWrap img{
      max-width: 230px;
      width: 100%;
      height:auto;
      filter: drop-shadow(0 20px 26px rgba(0,0,0,0.12));
      user-select:none;
      pointer-events:none;
    }

    .tip{
      padding: 12px 12px;
      border-radius: 18px;
      background: rgba(255,255,255,0.45);
      border: 1px solid var(--stroke);
      color: rgba(16,51,43,0.70);
      font-size: 12px;
      line-height: 1.35;
    }

    .right{
      border-radius: var(--radius);
      background: var(--glass-2);
      border: 1px solid var(--stroke);
      overflow:hidden;
      display:flex;
      flex-direction:column;
      min-height: 560px;
    }

    .topbar{
      padding: 16px 18px;
      display:flex;
      align-items:center;
      gap: 12px;
      border-bottom: 1px solid var(--stroke);
      background: rgba(255,255,255,0.34);
    }

    .homeBtn{
      border: 1px solid rgba(0,106,78,0.18);
      background: rgba(255,255,255,0.34);
      color: rgba(16,51,43,0.92);
      padding: 10px 12px;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 120ms ease, background 120ms ease, border-color 120ms ease, box-shadow 120ms ease;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      white-space: nowrap;
    }

    .homeBtn:hover{
      transform: translateY(-1px);
      background: rgba(255,255,255,0.48);
      border-color: rgba(0,106,78,0.24);
    }

    .ai-actions{
        margin-top: 12px;
        display: flex;
        gap: 10px;
        justify-content: flex-start;
        flex-wrap: wrap;
        }


    .progress{
      height: 10px;
      flex: 1;
      background: rgba(0,106,78,0.10);
      border: 1px solid rgba(0,106,78,0.14);
      border-radius: 999px;
      overflow:hidden;
    }
    .bar{
      height:100%;
      width:0%;
      background: linear-gradient(90deg, var(--c-forest), rgba(0,106,78,0.55));
      border-radius: 999px;
      transition: width 240ms ease;
    }
    .stepText{
      font-size: 12px;
      color: rgba(16,51,43,0.70);
      white-space:nowrap;
    }

    .content{
      padding: 18px;
      flex: 1;
      display:flex;
      flex-direction:column;
      gap: 14px;
    }

    .bubble{
      position: relative;
      width: fit-content;
      max-width: 100%;
      background: rgba(255,255,255,0.38);
      border: 1px solid rgba(0,106,78,0.16);
      border-radius: 18px;
      padding: 14px 14px;
      box-shadow: 0 14px 35px rgba(0,0,0,0.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .bubble::before{
      content:"";
      position:absolute;
      left: -7px;
      top: 18px;
      width: 14px;
      height: 14px;
      background: rgba(255,255,255,0.38);
      border-left: 1px solid rgba(0,106,78,0.16);
      border-bottom: 1px solid rgba(0,106,78,0.16);
      transform: rotate(45deg);
      border-bottom-left-radius: 4px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .qTitle{
      margin:0;
      font-size: 15px;
      line-height: 1.35;
      font-weight: 650;
      color: var(--c-forest);
    }
    .qHint{
      margin: 6px 0 0;
      color: rgba(16,51,43,0.70);
      font-size: 12px;
    }

    .answers{
      margin-top: 4px;
      display:flex;
      flex-direction:column;
      gap: 10px;
      max-width: 560px;
    }

    .optionGrid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .opt{
      border: 1px solid rgba(0,106,78,0.16);
      background: rgba(255,255,255,0.32);
      color: rgba(16,51,43,0.92);
      padding: 12px 12px;
      border-radius: 16px;
      cursor:pointer;
      text-align:left;
      transition: transform 120ms ease, background 120ms ease, border-color 120ms ease, box-shadow 120ms ease;
      min-height: 44px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .opt:hover{
      transform: translateY(-1px);
      background: rgba(255,255,255,0.46);
      border-color: rgba(0,106,78,0.22);
    }
    .opt.selected{
      background: rgba(136,207,161,0.35);
      border-color: rgba(0,106,78,0.45);
      box-shadow: 0 0 0 3px rgba(0,106,78,0.12);
    }

    .field{ display:flex; flex-direction:column; gap: 8px; }
    input[type="text"], input[type="number"], select{
      width: 100%;
      padding: 12px 12px;
      border-radius: 16px;
      border: 1px solid rgba(0,106,78,0.16);
      background: rgba(255,255,255,0.35);
      color: rgba(16,51,43,0.95);
      outline: none;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    input::placeholder{ color: rgba(16,51,43,0.45); }
    input:focus, select:focus{
      border-color: rgba(0,106,78,0.35);
      box-shadow: 0 0 0 3px rgba(0,106,78,0.10);
    }
    .smallNote{
      color: rgba(16,51,43,0.68);
      font-size: 12px;
    }

    .pillWrap{
      display:flex;
      flex-wrap:wrap;
      gap: 10px;
    }
    .pill{
      position: relative;
      display:inline-flex;
      align-items:center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid rgba(0,106,78,0.16);
      background: rgba(255,255,255,0.30);
      cursor:pointer;
      user-select:none;
      transition: background 120ms ease, border-color 120ms ease, transform 120ms ease, box-shadow 120ms ease;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .pill:hover{
      transform: translateY(-1px);
      background: rgba(255,255,255,0.44);
    }
    .pill input{
      appearance:none;
      width: 16px; height: 16px;
      border-radius: 5px;
      border: 1px solid rgba(0,106,78,0.22);
      background: rgba(255,255,255,0.45);
      display:grid;
      place-items:center;
      margin:0;
    }
    .pill input:checked{
      background: rgba(0,106,78,0.22);
      border-color: rgba(0,106,78,0.55);
      box-shadow: 0 0 0 3px rgba(0,106,78,0.10);
    }
    .pill input:checked::after{
      content:"✓";
      font-size: 12px;
      color: rgba(16,51,43,0.92);
      transform: translateY(-0.5px);
    }

    .footer{
      padding: 14px 18px;
      border-top: 1px solid var(--stroke);
      display:flex;
      align-items:center;
      gap: 10px;
      justify-content:space-between;
      background: rgba(255,255,255,0.34);
    }
    .toast{
      font-size: 12px;
      color: rgba(16,51,43,0.70);
    }
    .btnRow{ display:flex; gap: 10px; }
    .btn{
      border: 1px solid rgba(0,106,78,0.18);
      background: rgba(255,255,255,0.34);
      color: rgba(16,51,43,0.92);
      padding: 10px 12px;
      border-radius: 14px;
      cursor:pointer;
      transition: transform 120ms ease, background 120ms ease, border-color 120ms ease, box-shadow 120ms ease;
      min-width: 92px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .btn:hover{
      transform: translateY(-1px);
      background: rgba(255,255,255,0.48);
      border-color: rgba(0,106,78,0.24);
    }
    .btn.primary{
      background: rgba(0,106,78,0.16);
      border-color: rgba(0,106,78,0.40);
      box-shadow: 0 0 0 3px rgba(0,106,78,0.08) inset;
      font-weight: 650;
    }
    .btn.primary:disabled{
      opacity: 0.55;
      cursor:not-allowed;
      transform:none;
      box-shadow:none;
    }

    .summary{
      border-radius: 18px;
      border: 1px solid rgba(0,106,78,0.16);
      background: rgba(255,255,255,0.34);
      padding: 14px;
      max-width: 680px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .summary h3{ margin:0 0 10px; font-size: 14px; color: var(--c-forest); }

    .readable{
      border-radius: 14px;
      border: 1px solid rgba(0,106,78,0.14);
      background: rgba(255,255,255,0.32);
      padding: 12px;
      color: rgba(16,51,43,0.92);
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    details{
      margin-top: 12px;
      border-radius: 14px;
      border: 1px solid rgba(0,106,78,0.14);
      background: rgba(255,255,255,0.26);
      padding: 10px 12px;
    }
    details summary{
      cursor: pointer;
      color: rgba(16,51,43,0.80);
      font-size: 12px;
      user-select:none;
    }
    pre{
      margin: 10px 0 0;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid rgba(0,106,78,0.14);
      background: rgba(255,255,255,0.32);
      overflow:auto;
      color: rgba(16,51,43,0.92);
      font-size: 12px;
      line-height: 1.4;
    }

    @media (max-width: 860px){
      .app{ grid-template-columns: 1fr; }
      .left{ min-height: auto; }
      .avatarWrap img{ max-width: 170px; }
      .optionGrid{ grid-template-columns: 1fr; }
    }
  </style>
</head>

  <div class="app">
    <aside class="left">
      <div class="brand">
        <div class="dot"></div>
        <h1 id="brandTitle">COMMUNITY SURVEY</h1>
        <span id="clock"></span>
      </div>

      <div class="avatarWrap">
        <img src="girl-smiling.png" alt="Guide character" />
      </div>

      <div class="tip" id="tipText">
        <b>Tip:</b> Press <b>Enter</b> on text questions to go next.
        <br/>Nothing is uploaded — this runs locally in your browser.
      </div>
    </aside>

    <main class="right">
      <div class="topbar">
        <button class="homeBtn" type="button" onclick="window.location.href='/'">← Home</button>

        <div class="progress" aria-label="Progress">
          <div class="bar" id="bar"></div>
        </div>
        <div class="stepText" id="stepText">Step 1 of 8</div>
      </div>

      <section class="content">
        <div class="bubble" id="bubble">
          <p class="qTitle" id="qTitle">Loading…</p>
          <p class="qHint" id="qHint"></p>
        </div>

        <div class="answers" id="answers"></div>
        <div id="summaryMount"></div>
      </section>

      <div class="footer">
        <div class="toast" id="toast"> </div>
        <div class="btnRow">
          <button class="btn" id="backBtn">Back</button>
          <button class="btn primary" id="nextBtn" disabled>Next</button>
        </div>
      </div>
    </main>
  </div>

  function getQuestionText(q){
    const bundle = QUESTIONS_I18N[uiLang]?.[q.key];

      title: bundle?.title ?? q.title,

      placeholder: bundle?.placeholder ?? q.placeholder,

    };

  function progress(){
    const total = questions.length;
    const pct = (step / total) * 100;
    bar.style.width = `${Math.max(6, pct)}%`;
    stepText.textContent = t().step(Math.min(step+1,total), total);
  }

  function canGoNext(){
    const q = questions[step];
    const v = answersState[q.key];

    if (q.type === "text")   return typeof v === "string" && v.trim().length > 0;
    if (q.type === "number") return Number.isFinite(v) && v >= (q.min ?? -Infinity) && v <= (q.max ?? Infinity);
    if (q.type === "single") return typeof v === "string" && v.length > 0;
    if (q.type === "multi")  return Array.isArray(v) && v.length > 0;
    return false;
  }

  function updateNextDisabled(){
    nextBtn.disabled = !canGoNext();
  }

  function render(){
    summaryMount.innerHTML = "";
    answers.innerHTML = "";
    setToast("");

    const q = questions[step];
    const qt = getQuestionText(q);

    qTitle.textContent = qt.title;
    qHint.textContent  = qt.hint || "";

    backBtn.disabled = (step === 0);
    progress();

    if (q.type === "text"){
      const wrap = document.createElement("div");
      wrap.className = "field";

      const input = document.createElement("input");
      input.type = "text";
      input.placeholder = qt.placeholder || "";
      input.value = answersState[q.key] ?? "";
      input.autocomplete = "off";
      input.addEventListener("input", () => {
        answersState[q.key] = input.value;
        updateNextDisabled();
      });
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !nextBtn.disabled) next();
      });

      wrap.appendChild(input);

      const note = document.createElement("div");
      note.className = "smallNote";
      note.textContent = t().cityNote;
      wrap.appendChild(note);

      answers.appendChild(wrap);
    }

    if (q.type === "number"){
      const wrap = document.createElement("div");
      wrap.className = "field";

      const input = document.createElement("input");
      input.type = "number";
      input.placeholder = qt.placeholder || "";
      if (q.min != null) input.min = q.min;
      if (q.max != null) input.max = q.max;

      const current = answersState[q.key];
      input.value = Number.isFinite(current) ? String(current) : "";

      input.addEventListener("input", () => {
        const num = Number(input.value);
        answersState[q.key] = Number.isFinite(num) ? num : NaN;
        updateNextDisabled();
      });
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !nextBtn.disabled) next();
      });

      wrap.appendChild(input);

      const note = document.createElement("div");
      note.className = "smallNote";
      // Keep this note simple / neutral across langs (optional to translate more)
      note.textContent = `${q.min ?? 0}–${q.max ?? 120}`;
      wrap.appendChild(note);

      answers.appendChild(wrap);
    }

    if (q.type === "single"){
      const grid = document.createElement("div");
      grid.className = "optionGrid";

      const current = answersState[q.key] ?? "";
      (qt.options || []).forEach(opt => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "opt" + (current === opt ? " selected" : "");
        btn.textContent = opt;

        btn.addEventListener("click", () => {
          answersState[q.key] = opt;

          // If they just selected LANGUAGE (step 0), switch the whole UI language immediately.
          if (q.key === "language"){
            const map = LANGUAGE_MAP[opt] || LANGUAGE_MAP.Other;
            applyUiLanguage(map.code);
          }

          render();
          updateNextDisabled();
        });

        grid.appendChild(btn);
      });

      answers.appendChild(grid);
    }

    if (q.type === "multi"){
      const wrap = document.createElement("div");
      wrap.className = "pillWrap";

      const currentSet = new Set(answersState[q.key] ?? []);

      const qtOptions = qt.options || [];
      qtOptions.forEach(opt => {
        const label = document.createElement("label");
        label.className = "pill";

        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = currentSet.has(opt);

        cb.addEventListener("change", () => {
          if (cb.checked) currentSet.add(opt);
          else currentSet.delete(opt);
          answersState[q.key] = Array.from(currentSet);
          updateNextDisabled();
        });

        const text = document.createElement("span");
        text.textContent = opt;

        label.appendChild(cb);
        label.appendChild(text);
        wrap.appendChild(label);
      });

      answers.appendChild(wrap);

      const note = document.createElement("div");
      note.className = "smallNote";
      note.textContent = t().multiNote;
      answers.appendChild(note);
    }

    nextBtn.textContent = (step === questions.length - 1) ? t().finish : t().next;
    backBtn.textContent = t().back;
    updateNextDisabled();
  }

  function buildPayload(){
    const answersByKey = {};
    const answersWithLabels = {};

    questions.forEach(q => {
      const v = answersState[q.key] ?? null;
      answersByKey[q.key] = v;

      // use localized label for readability
      const qt = getQuestionText(q);
      answersWithLabels[qt.title] = v;
    });

    const selected = answersState.language || "Other";
    const langMeta = LANGUAGE_MAP[selected] || LANGUAGE_MAP.Other;

    return {
      submittedAt: new Date().toISOString(),
      schemaVersion: 2,
      uiLanguage: langMeta.code,                  // e.g. "es"
      responseLanguageName: langMeta.name,        // e.g. "Spanish"
      answersByKey,
      answersWithLabels,
      // For your backend to forward directly to the model:
      instruction:
        `Respond in ${langMeta.name}. Keep it friendly, clear, and actionable.`
    };
  }

  function downloadJSON(obj, filename){
    const json = JSON.stringify(obj, null, 2);
    const blob = new Blob([json], { type: "application/json" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();

    URL.revokeObjectURL(url);
  }

  function escapeHTML(s){
  return String(s)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

// Turns URLs (and [text](url)) into clickable links + keeps line breaks.
function linkifyText(raw){
  let s = escapeHTML(raw || "");

  // Markdown links: [label](https://example.com)
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (m, label, url) => {
    const safeLabel = escapeHTML(label);
    return `<a href="${url}" target="_blank" rel="noopener noreferrer">${safeLabel}</a>`;
  });

  // Plain URLs
  s = s.replace(/(https?:\/\/[^\s<]+[^\s<\.)\]])/g, (url) => {
    return `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`;
  });

  // Newlines -> <br>
  s = s.replace(/\n/g, "<br>");
  return s;
}

function downloadText(text, filename, mime="text/plain"){
  const blob = new Blob([text ?? ""], { type: mime });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();

  URL.revokeObjectURL(url);
}


  async function sendToAI(payload){
    const res = await fetch("/api/ai-summary", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    if (!res.ok){
      const text = await res.text().catch(() => "");
      throw new Error(`AI endpoint failed (${res.status}). ${text}`);
    }

    const data = await res.json();
    return data.summary;
  }

    downloadBtn.type = "button";
    downloadBtn.textContent = t().dlAgain;
    downloadBtn.addEventListener("click", () => downloadJSON(payload, "survey-response.json"));

    row.appendChild(copyBtn);
    row.appendChild(dlPayloadBtn);
    row.appendChild(dlAiBtn);
    row.appendChild(downloadBtn);
    details.appendChild(row);

    summary.appendChild(details);
    summaryMount.innerHTML = "";
    summaryMount.appendChild(summary);

    try {
      const aiText = await sendToAI(payload);
    latestAiText = aiText || "";
    readable.innerHTML = linkifyText(aiText || "—");
    dlAiBtn.disabled = !latestAiText;
    dlAiBtn.style.display = "inline-flex";

      qHint.textContent = ""; // keep it clean
      setToast(t().summaryReady);
    } catch (err) {
      const msg = t().aiFailBody(err?.message || String(err));
      latestAiText = msg;
      readable.innerHTML = linkifyText(msg);
      dlAiBtn.disabled = false; // let them download the error text too if you want

      qHint.textContent = t().aiFailHint;
      setToast(t().dlOk);
    }
  }

  function next(){
    if (!canGoNext()){
      setToast(t().toastAnswer);
      return;
    }
    if (step === questions.length - 1){
      showSummary();
      return;
    }
    step++;
    render();
  }

  function back(){
    if (step > 0){
      step--;
      render();
    }
  }

  backBtn.addEventListener("click", back);
  nextBtn.addEventListener("click", next);

  // Init UI (English)
  applyUiLanguage("en");
  render();
</script>
</body>
</html>
